<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RESTUDING — Beta v0.6 · Múltiplos Finais</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#07070d">
<style>
html,body{margin:0;padding:0;height:100%;background:#07070d;overflow:hidden;
 font-family:'Courier New',monospace;-webkit-user-select:none;user-select:none;touch-action:none}
#wrap{display:flex;flex-direction:column;height:100%}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
#touch{display:none;background:#0b0b14;border-top:2px solid #23233a;padding:10px 12px 14px;
 gap:12px;align-items:center;justify-content:space-between;flex:0 0 auto}
#touch.on{display:flex}
#dpad,#acts{display:flex;gap:10px;align-items:center}
#acts{flex-direction:column}
#touch button{font-family:inherit;font-weight:bold;border-radius:10px;border:2px solid rgba(255,255,255,.25);
 background:rgba(255,255,255,.10);color:#fff;font-size:22px;min-width:64px;min-height:56px;padding:0;
 touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button:active{background:rgba(255,255,255,.30)}
#bjump{background:#1d4ed8;border-color:#60a5fa;min-width:96px;min-height:72px;font-size:15px}
#bjump:active{background:#3b82f6}

#bint:active{background:#eab308}

<body>
<div id="wrap">
 <div id="stage"><canvas id="game" width="480" height="270"></canvas></div>
 <div id="touch">
  <div id="dpad"><button id="bl">◀</button><button id="br">▶</button></div>
  <div id="acts"><button id="bint">INTERAGIR</button><button id="bjump">PULAR</button></div>
 </div>
</div>
<script>
"use strict";
/* ============================================================
   RESTUDING — Beta v0.6
   Platformer 2D indie · Múltiplos finais
   Resolução interna 480x270 · Canvas + JS · standalone
   ============================================================ */

// ---------- constantes ----------
const IW=480, IH=270;
const GRAV=0.4, JUMPF=-7, SPD=1.8;
const GROUND_Y=248, WALL_L=12, WALL_R=IW-12;
const IK=()=>IS_TOUCH?'A':'E';

const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

const IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||matchMedia('(pointer:coarse)').matches;

// ---------- assets ----------
const imgs={t:new Image(),s:new Image(),bg:new Image()};
imgs.t.src='data:image/png;base64,__B64_T__';
imgs.s.src='data:image/png;base64,__B64_S__';
imgs.bg.src='data:image/png;base64,__B64_BG__';
let ready=0;
['t','s','bg'].forEach(k=>imgs[k].onload=()=>ready++);

// ---------- audio (WebAudio, sem arquivos) ----------
let AC=null, soundOn=true;
function ac(){
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
 }catch(e){return null}
}
function beep(f0,f1,dur,type,vol){
 if(!soundOn)return;
 const a=ac(); if(!a)return;
 try{
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.09,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime+dur);
 }catch(e){}
}
const sfx={
 jump:()=>beep(170,430,0.12,'square',0.07),
 land:()=>beep(140,90,0.06,'triangle',0.05),
 pick:()=>{beep(660,990,0.10,'sine',0.11);setTimeout(()=>beep(990,1480,0.12,'sine',0.09),70);},
 talk:()=>beep(880,880,0.04,'sine',0.04),
 slide:()=>beep(700,980,0.07,'sine',0.06),
 deny:()=>beep(190,110,0.18,'sawtooth',0.07),
 good:()=>{beep(659,659,0.09,'sine',0.08);setTimeout(()=>beep(880,880,0.14,'sine',0.08),90);},
 teach:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,f*1.01,0.16,'triangle',0.09),i*90));},
 ending:()=>{[392,494,587,784].forEach((f,i)=>setTimeout(()=>beep(f,f*1.01,0.5,'triangle',0.07),i*140));},
 portal:()=>beep(60,150,0.6,'sawtooth',0.09)
};

// ---------- salvamento (finais descobertos) ----------
let found=[];
try{found=JSON.parse(localStorage.getItem('restuding_endings')||'[]');}catch(e){}
function markEnding(id){
 if(!found.includes(id)){found.push(id);try{localStorage.setItem('restuding_endings',JSON.stringify(found));}catch(e){}}
}

// ---------- dados ----------
const SCRIPT=[
 {slide:0,txt:'Olá, professor! Sou a Felquinha, sua aluna. Hoje a aula é especial: SALVAR O MUNDO.'},
 {slide:1,txt:'Vamos ao manual! Use as SETAS ← e → no PC — ou o D-PAD no Android — para andar.'},
 {slide:2,txt:'ESPAÇO, W ou ↑ pula (botão AZUL no Android). O pulo abre caminhos novos!'},
 {slide:3,txt:'E, ENTER ou Z interage (botão AMARELO no Android). Pegue o item ENSINAR e volte até mim!'}
];
const ENDINGS={
 e1:{num:1,name:'O PRIMEIRO ENSINAMENTO',col:'#ffd75e',lines:[
  'Você entregou o item ENSINAR a Felquinha.',
  'O feixe de luz atravessou a sala, a escola... e o mundo.',
  'O Caos recuou um passo.',
  'A aula de salvar o mundo começou.']},
 e2:{num:2,name:'O NOVO DOUTOR CAOS',col:'#b06cff',lines:[
  'Você aceitou o poder do portal.',
  'Ele sussurrou seu novo nome.',
  'Agora a escola... e talvez o mundo,',
  'responde apenas a você.',
  'Os alunos sussurram: o professor',
  'virou o Doutor Caos.']},
 e3:{num:3,name:'O SOBREVIVENTE',col:'#cfd6dd',lines:[
  'Atrás da estante havia uma porta.',
  'Você fugiu da aula — e do mundo.',
  'Por enquanto, está seguro.',
  'Mas a missão continua esperando',
  'por um professor de verdade.']}
};
const SOLIDS=[
 {x:8,y:150,w:116,h:98,name:'tv'},
 {x:134,y:200,w:44,h:48,name:'shelf'},
 {x:300,y:214,w:80,h:34,name:'desk'},
 {x:386,y:226,w:20,h:22,name:'student'}
];
const ORBS=[{x:156,y:188},{x:340,y:202}];
const STARS=Array.from({length:70},()=>({x:Math.random()*IW|0,y:Math.random()*190|0,r:Math.random()<0.3?2:1,sp:0.02+Math.random()*0.05,ph:Math.random()*6.28}));

// ---------- estado ----------
let state='title', T=0;
let P=null, wasOnG=true;
let parts=[], toast=null, hintBox=null, flash=null;
let portalOn=true, teachT=0, introT=0;
let endId=null, endChar=0, endTimer=0;
let itemGot=false, orbsGot=[false,false], taught=false;
let choice=null;
let pres={idx:0,char:0,wait:0};

function resetGame(){
 P={x:210,y:GROUND_Y-22,w:14,h:22,vy:0,onG:true,face:1,hasItem:false,karma:0,orbs:0};
 parts=[];toast=null;hintBox=null;flash=null;
 portalOn=true;teachT=0;introT=150;
 itemGot=false;orbsGot=[false,false];taught=false;choice=null;
 pres={idx:0,char:0,wait:0};wasOnG=true;
 state='class';
}

// ---------- input (abstração PC + touch) ----------
const keys={};
const touch={l:false,r:false,j:false,i:false};
let jumpQueued=false, interactQueued=false;
window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyW','KeyA','KeyD','KeyE','KeyZ','Enter'].indexOf(e.code)>=0)e.preventDefault();
 if(e.repeat)return;
 keys[e.code]=true;
 if(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp')jumpQueued=true;
 if(e.code==='KeyE'||e.code==='Enter'||e.code==='KeyZ')interactQueued=true;
 if(e.code==='KeyM'){soundOn=!soundOn;showToast('SOM: '+(soundOn?'LIGADO':'DESLIGADO'));}
 if(e.code==='KeyT'){const t=document.getElementById('touch');if(t)t.classList.toggle('on');}
 ac();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touch.l=touch.r=false;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function bindBtn(id,prop){
 const el=document.getElementById(id); if(!el)return;
 const on=e=>{e.preventDefault();touch[prop]=true;if(prop==='j')jumpQueued=true;if(prop==='i')interactQueued=true;ac();};
 const off=e=>{e.preventDefault();touch[prop]=false;};
 el.addEventListener('pointerdown',on);
 el.addEventListener('pointerup',off);
 el.addEventListener('pointercancel',off);
 el.addEventListener('pointerleave',off);
}
bindBtn('bl','l');bindBtn('br','r');bindBtn('bjump','j');bindBtn('bint','i');
if(IS_TOUCH){const t=document.getElementById('touch');if(t)t.classList.add('on');}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();ac();
 if(state==='title'||state==='ending')interactQueued=true;
 else if(state==='class'&&!choice)interactQueued=true;
});
function input(){
 return{
  l:keys['ArrowLeft']||keys['KeyA']||touch.l,
  r:keys['ArrowRight']||keys['KeyD']||touch.r,
  j:jumpQueued,
  i:interactQueued
 };
}
function clearQueues(){jumpQueued=false;interactQueued=false;}

// ---------- física ----------
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function physics(){
 const inp=input();
 let vx=0;
 if(inp.l)vx=-SPD;
 if(inp.r)vx=SPD;
 if(vx)P.face=vx>0?1:-1;
 P.x+=vx;
 for(const s of SOLIDS){
  if(hit(P,s)){if(vx>0)P.x=s.x-P.w;else if(vx<0)P.x=s.x+s.w;}
 }
 if(P.x<WALL_L)P.x=WALL_L;
 if(P.x>WALL_R-P.w)P.x=WALL_R-P.w;
 P.vy+=GRAV; if(P.vy>10)P.vy=10;
 P.y+=P.vy;
 const was=P.onG;
 P.onG=false;
 for(const s of SOLIDS){
  if(hit(P,s)){
   if(P.vy>0&&P.y<s.y){P.y=s.y-P.h;P.vy=0;P.onG=true;}
   else if(P.vy<0){P.y=s.y+s.h;P.vy=0;}
   else if(vx>0)P.x=s.x-P.w;
   else if(vx<0)P.x=s.x+s.w;
  }
 }
 if(P.y+P.h>=GROUND_Y){P.y=GROUND_Y-P.h;P.vy=0;P.onG=true;}
 if(P.onG&&!was)sfx.land();
}

// ---------- partículas ----------
function spawnBurst(x,y,col,n){
 for(let i=0;i<n;i++){
  const a=Math.random()*6.283,sp=0.5+Math.random()*1.5;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.5,life:(24+Math.random()*14)|0,col,s:Math.random()<0.4?2:1});
 }
}
function spawnBeam(){
 const tx=396,ty=234,sx=P.x+P.w/2,sy=P.y+10,f=Math.random();
 parts.push({x:sx+(tx-sx)*f,y:sy+(ty-sy)*f,vx:0,vy:-0.3-Math.random()*0.5,life:20,col:'255,215,94',s:2});
}
function updateParts(){
 for(let i=parts.length-1;i>=0;i--){
  const p=parts[i];
  p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.life--;
  if(p.life<=0)parts.splice(i,1);
 }
}

// ---------- HUD helpers ----------
function showToast(t){toast={txt:t,t:200};}
function say(spk,txt){hintBox={spk,txt,char:0,t:0};}

// ---------- interações ----------
function doInteract(){
 if(choice){confirmChoice();return;}
 if(pres.idx<SCRIPT.length){
  const L=SCRIPT[pres.idx];
  if(pres.char<L.txt.length)pres.char=L.txt.length;
  else nextPres();
  return;
 }
 const px=P.x+P.w/2;
 // 1. portinhola secreta (em cima da estante)
 if(P.onG&&P.y+P.h<=202&&px>126&&px<186){startEnding('e3');return;}
 // 2. item ENSINAR
 if(!itemGot&&Math.abs(px-444)<26){
  itemGot=true;P.hasItem=true;sfx.pick();flash={c:'255,215,94',t:12,max:12};
  spawnBurst(444,240,'255,215,94',12);
  showToast('Item ENSINAR obtido! Volte até a Felquinha.');
  return;
 }
 // 3. aluno Felquinha
 if(Math.abs(px-396)<40){
  if(P.hasItem&&!taught){taught=true;state='teach';teachT=0;sfx.teach();}
  else if(!P.hasItem){say('Felquinha','Você precisa do item ENSINAR! Está brilhando perto da parede da direita.');sfx.talk();}
  else{say('Felquinha','Já te ensinei uma vez... o mundo só tem a ganhar, professor!');sfx.talk();}
  return;
 }
 // 4. portal
 if(portalOn&&px>436){choice={sel:0};sfx.portal();return;}
 // 5. cartaz
 if(px<205&&P.onG){say('Cartaz','AULA DE HOJE: SALVAR O MUNDO. — A Diretoria');sfx.talk();return;}
}
function nextPres(){
 if(pres.idx>=SCRIPT.length)return;
 pres.idx++;pres.char=0;pres.wait=0;
 if(pres.idx<SCRIPT.length)sfx.slide();
}
function confirmChoice(){
 if(!choice)return;
 if(choice.sel===0){
  choice=null;P.karma-=50;
  flash={c:'150,80,255',t:40,max:40};sfx.portal();
  startEnding('e2');
 }else{
  choice=null;P.karma+=10;portalOn=false;
  flash={c:'255,255,255',t:14,max:14};sfx.good();
  say('Felquinha','Boa escolha, professor! O portal se selou. Agora sim... vamos ensinar?');
 }
}
function startEnding(id){
 markEnding(id);
 state='ending';endId=id;endChar=0;endTimer=0;
 sfx.ending();
}
function currentInteract(){
 if(pres.idx<SCRIPT.length||choice)return null;
 const px=P.x+P.w/2;
 if(P.onG&&P.y+P.h<=202&&px>126&&px<186)return{x:156,y:128,txt:'[ '+IK()+' ] ENTRAR'};
 if(!itemGot&&Math.abs(px-444)<26)return{x:444,y:214,txt:'[ '+IK()+' ] PEGAR ENSINAR'};
 if(Math.abs(px-396)<40&&P.hasItem&&!taught)return{x:396,y:204,txt:'[ '+IK()+' ] ENSINAR'};
 if(portalOn&&px>436)return{x:450,y:92,txt:'[ '+IK()+' ] TOCAR'};
 if(px<205&&P.onG)return{x:30,y:32,txt:'[ '+IK()+' ] LER'};
 return null;
}
function endText(){
 const E=ENDINGS[endId];
 const lines=E.lines.slice();
 if(endId==='e1'&&P.orbs>=2)lines.splice(lines.length-1,0,'BÔNUS: Conhecimento completo! (2/2 orbes)');
 return lines.join('\n');
}

// ---------- updates ----------
function updClass(){
 const inp=input();
 if(choice){
  if(inp.l||inp.r){choice.sel^=1;sfx.talk();}
  if(keys['Escape']){choice=null;showToast('Você recuou. O portal espera...');}
  else if(inp.i)confirmChoice();
  clearQueues();
  if(toast){toast.t--;if(toast.t<=0)toast=null;}
  return;
 }
 physics();
 if(inp.j&&P.onG){P.vy=JUMPF;P.onG=false;sfx.jump();}
 if(!itemGot&&Math.abs(P.x+P.w/2-444)<18){
  itemGot=true;P.hasItem=true;sfx.pick();
  flash={c:'255,215,94',t:12,max:12};
  spawnBurst(444,240,'255,215,94',12);
  showToast('Item ENSINAR obtido! Volte até a Felquinha.');
 }
 ORBS.forEach((o,i)=>{
  if(orbsGot[i])return;
  const oy=o.y+Math.sin(T/12+i*2)*2;
  if(Math.abs(P.x+P.w/2-o.x)<12&&Math.abs(P.y+P.h/2-oy)<14){
   orbsGot[i]=true;P.orbs++;P.karma+=5;sfx.good();
   spawnBurst(o.x,oy,'125,240,255',10);
   showToast('Orbe de conhecimento! ('+P.orbs+'/2)');
  }
 });
 if(inp.i)doInteract();
 if(pres.idx<SCRIPT.length){
  const L=SCRIPT[pres.idx];
  if(pres.char<L.txt.length){pres.char++;if(pres.char%4===0)sfx.talk();}
  else{pres.wait++;if(pres.wait>85)nextPres();}
 }
 if(hintBox){hintBox.t++;if(hintBox.char<hintBox.txt.length)hintBox.char++;if(hintBox.t>300)hintBox=null;}
 if(toast){toast.t--;if(toast.t<=0)toast=null;}
 if(introT>0)introT--;
 if(portalOn&&T%6===0)parts.push({x:466+Math.random()*6,y:58+Math.random()*84,vx:-(0.3+Math.random()*0.5),vy:-(0.2+Math.random()*0.4),life:16,col:'176,108,255',s:1});
 updateParts();
 clearQueues();
}
function updTeach(){
 teachT++;
 if(teachT%2===0)spawnBeam();
 if(teachT===70)flash={c:'255,235,170',t:24,max:24};
 updateParts();
 if(teachT>=120)startEnding('e1');
}
function updEnding(){
 endTimer++;
 const txt=endText();
 if(endChar<txt.length)endChar=Math.min(txt.length,endChar+2);
 if(endTimer>60&&(interactQueued||jumpQueued))state='title';
 clearQueues();
}

// ---------- desenhos básicos ----------
function text(s,x,y,size,color,align){
 ctx.font='bold '+size+'px "Courier New",monospace';
 ctx.textAlign=align||'center';
 ctx.textBaseline='top';
 ctx.fillStyle=color;
 ctx.fillText(s,x,y);
}
function rr(x,y,w,h,r){
 ctx.beginPath();
 ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);
 ctx.closePath();ctx.fill();
}
function arrow(x,y,s,d,col){
 ctx.fillStyle=col;
 ctx.beginPath();
 if(d==='R'){ctx.moveTo(x-s/2,y-s*0.62);ctx.lineTo(x+s/2,y);ctx.lineTo(x-s/2,y+s*0.62);}
 if(d==='L'){ctx.moveTo(x+s/2,y-s*0.62);ctx.lineTo(x-s/2,y);ctx.lineTo(x+s/2,y+s*0.62);}
 if(d==='U'){ctx.moveTo(x-s*0.62,y+s/2);ctx.lineTo(x,y-s/2);ctx.lineTo(x+s*0.62,y+s/2);}
 ctx.closePath();ctx.fill();
}
function star(x,y,r,col){
 ctx.fillStyle=col;
 ctx.beginPath();
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4-Math.PI/2;
  const rad=i%2===0?r:r*0.45;
  const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;
  if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);
 }
 ctx.closePath();ctx.fill();
}
function drawSprite(img,cx,feetY,size,flip){
 const x=cx-size/2,y=feetY-size+2;
 if(!flip){ctx.drawImage(img,x,y,size,size);return;}
 ctx.save();ctx.translate(cx,0);ctx.scale(-1,1);
 ctx.drawImage(img,-size/2,y,size,size);
 ctx.restore();
}

// ---------- cenário ----------
function drawPoster(){
 ctx.fillStyle='#f2ead6';ctx.fillRect(2,40,56,100);
 ctx.fillStyle='#b3372f';ctx.fillRect(2,40,56,10);
 text('AVISO',30,42,6,'#fff');
 text('SALVE',30,58,9,'#26262e');
 text('O MUNDO',30,71,8,'#26262e');
 star(30,94,6,'#ffd75e');
 text('AULA DE HOJE',30,110,5,'#7a7466');
 text('— a diretoria',30,120,5,'#9a9486');
}
function drawHatch(){
 const near=P&&P.onG&&P.y+P.h<=202&&P.x+P.w/2>120&&P.x+P.w/2<200;
 ctx.globalAlpha=near?1:0.22;
 ctx.fillStyle='#3a2c1c';ctx.fillRect(138,138,36,62);
 ctx.fillStyle='#241a0f';ctx.fillRect(141,141,30,56);
 ctx.fillStyle='#d9b45b';ctx.fillRect(166,168,3,5);
 ctx.globalAlpha=1;
}
function drawShelf(){
 ctx.fillStyle='#6b4a2b';ctx.fillRect(134,200,44,48);
 ctx.fillStyle='#4a3117';ctx.fillRect(137,204,38,40);
 ctx.fillStyle='#6b4a2b';ctx.fillRect(137,218,38,4);ctx.fillRect(137,234,38,4);
 const cols=['#c0533f','#3f7ec0','#57a05a','#c0a23f','#8e5ac0','#c0533f','#3f7ec0'];
 for(let i=0;i<7;i++){ctx.fillStyle=cols[i];ctx.fillRect(139+i*5,207+(i%2),4,11-(i%3)*2);}
 for(let i=0;i<6;i++){ctx.fillStyle=cols[(i+3)%7];ctx.fillRect(140+i*6,223+(i%2),5,10-(i%2)*3);}
 for(let i=0;i<5;i++){ctx.fillStyle=cols[(i+1)%7];ctx.fillRect(141+i*7,238,6,5);}
}
function drawDesk(){
 ctx.fillStyle='#7c4f28';ctx.fillRect(300,214,80,3);

// ---------- loop ----------
function draw(){
 ctx.clearRect(0,0,IW,IH);
 if(state==='title')drawTitle();
 else if(state==='class')drawRoom();
 else if(state==='teach'){drawRoom();drawTeachFX();}
 else if(state==='ending')drawEnding();
 if(flash&&flash.t>0){
  ctx.fillStyle='rgba('+flash.c+','+(flash.t/flash.max*0.7).toFixed(2)+')';
  ctx.fillRect(0,0,IW,IH);
 }
}
function loop(){
 T++;
 if(flash){flash.t--;if(flash.t<=0)flash=null;}
 if(state==='class')updClass();
 else if(state==='teach')updTeach();
 else if(state==='ending')updEnding();
 else if(state==='title'){
  if(interactQueued||jumpQueued){if(ready>=3)resetGame();}
  clearQueues();
 }
 draw();
 requestAnimationFrame(loop);
}

// ---------- resize ----------
function fit(){
 const st=document.getElementById('stage');
 if(!st)return;
 const w=st.clientWidth,h=st.clientHeight;
 const s=Math.min(w/IW,h/IH);
 cv.style.width=((IW*s)|0)+'px';
 cv.style.height=((IH*s)|0)+'px';
}
window.addEventListener('resize',fit);
fit();
requestAnimationFrame(loop);

// ---------- hook para testes ----------
globalThis.__R={
 get state(){return state;},
 get P(){return P;},
 get found(){return found.slice();},
 get pres(){return pres;},
 reset:resetGame
};
