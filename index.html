<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>RESTUDING - Beta v0.7</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="gameArea">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="mCtrl">
    <div class="dpad">
      <button class="dbtn" id="btnLeft">◀</button>
      <button class="dbtn" id="btnRight">▶</button>
    </div>
    <div class="acts">
      <button class="abtn" id="btnInteract">INTERAGIR</button>
      <button class="abtn" id="btnJump">PULAR</button>
    </div>
  </div>
  <div id="audioCtrl">
    <button id="btnMute" class="mute-btn">🔊</button>
  </div>

  <!-- Ordem importa: save → audio → render → game -->
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
